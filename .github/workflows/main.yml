name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p Switcher/app/src/main/java/com/example/switcher Switcher/app/src/main/res/layout Switcher/app/src/main/res/values
          echo cGx1Z2luTWFuYWdlbWVudCB7CiAgICByZXBvc2l0b3JpZXMgewogICAgICAgIGdvb2dsZSgpCiAgICAgICAgbWF2ZW5DZW50cmFsKCkKICAgICAgICBncmFkbGVQbHVnaW5Qb3J0YWwoKQogICAgfQp9CnJvb3RQcm9qZWN0Lm5hbWUgPSAiU3dpdGNoZXIiCmluY2x1ZGUoIjphcHAiKQo= | base64 -d > Switcher/settings.gradle.kts
          echo cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQp9Cg== | base64 -d > Switcher/build.gradle.kts
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg== | base64 -d > Switcher/gradle.properties
          echo  | base64 -d > Switcher/app/build.gradle.kts
          echo  | base64 -d > Switcher/app/src/main/AndroidManifest.xml
          echo  | base64 -d > Switcher/app/src/main/java/com/example/switcher/MainActivity.kt
          echo  | base64 -d > Switcher/app/src/main/java/com/example/switcher/SwitcherService.kt
          echo  | base64 -d > Switcher/app/src/main/res/layout/activity_main.xml
          echo PHJlc291cmNlcz4KICAgIDxzdHlsZSBuYW1lPSJUaGVtZS5Td2l0Y2hlciIgcGFyZW50PSJhbmRyb2lkOnN0eWxlL1RoZW1lLk1hdGVyaWFsLkxpZ2h0Lk5vQWN0aW9uQmFyIi8+CjwvcmVzb3VyY2VzPgo= | base64 -d > Switcher/app/src/main/res/values/styles.xml
      - name: Build APK
        run: gradle -p Switcher assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Switcher-APK
          path: Switcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
